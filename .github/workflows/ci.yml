name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: install deps
      run: |
        sudo apt update
        sudo apt install -y g++ make

    - name: build (instrumented)
      run: make WITH_COVERAGE=1

    - name: test
      run: bash testpp/run.sh

    - name: gcov
      run: make gcov

    - name: install cpp-coveralls
      if: env.COVERALLS_REPO_TOKEN != ''
      run: pip install --user cpp-coveralls

    - name: upload to coveralls
      if: env.COVERALLS_REPO_TOKEN != ''
      run: coveralls -n --include coseq --include coseqpp
